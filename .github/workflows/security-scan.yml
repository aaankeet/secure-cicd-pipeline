name: Security Scan Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install jq (needed for parser)
      - name: Install jq
        run: sudo apt-get install -y jq

      # ----------------------------
      # 3. Gitleaks CLI (Reliable JSON generation)
      # ----------------------------
      - name: Run Gitleaks
        run: |
          VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      # 4. Semgrep (SAST)
      # ----------------------------
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config p/python \
                  --config p/security-audit \
                  --config policies/semgrep-rules \
                  --include '*.py' \
                  --sarif \
                  --output semgrep-results.sarif \
                  --error || true

      # ----------------------------
      # 5. Debug
      # ----------------------------
      - name: List generated files
        if: always()
        run: |
          ls -lah
          cat gitleaks-report.json || true
          cat semgrep-results.sarif || true

      # ----------------------------
      # 6. Run Parser Script
      # ----------------------------
      - name: Run Scan Results Parser
        if: always() && github.event_name == 'pull_request'
        run: |
          chmod +x scripts/scan-results-parser.sh
          ./scripts/scan-results-parser.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # ----------------------------
      # 6. Upload Scan Reports
      # ----------------------------
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            semgrep-results.sarif
